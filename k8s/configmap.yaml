apiVersion: v1
kind: ConfigMap
metadata:
  name: 4frames-config
  namespace: default
  labels:
    app: 4frames-api
data:
  NODE_ENV: production
  APP_ENV: '${APP_ENV}'
  PORT: '3000'
  LOG_LEVEL: info
  CORS_ORIGIN: '${CORS_ORIGIN}'
  DB_SSLMODE: disable
  JWT_EXPIRES_IN: '21600'
  AWS_REGION: '${AWS_REGION}'
  AWS_ENDPOINT_URL: '${AWS_ENDPOINT_URL}'
  S3_PUBLIC_ENDPOINT_URL: '${S3_PUBLIC_ENDPOINT_URL}'
  S3_BUCKET_NAME: '${S3_BUCKET_NAME}'
  UPLOAD_URL_TTL_SECONDS: '300'
  SQS_QUEUE_URL: '${SQS_QUEUE_URL}'
  SQS_DLQ_URL: '${SQS_DLQ_URL}'
  VISIBILITY_TIMEOUT_SECONDS: '600'
  REDIS_URL: '${REDIS_URL}'
  FRAME_FPS: '1'
  FRAME_FORMAT: png
  MAX_VIDEO_DURATION_SECONDS: '600'
  WORKER_TMP_DIR: /tmp/4frames
  WORKER_HEALTH_PORT: '9100'
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: '570'
  FFMPEG_TIMEOUT_SECONDS: '1800'
  # No kind + KEDA: 1 vídeo por réplica (escala horizontal). Compose pode usar >1.
  WORKER_MAX_PARALLEL_JOBS: '1'
  SMTP_HOST: '${SMTP_HOST}'
  SMTP_PORT: '${SMTP_PORT}'
  MAIL_FROM: '${MAIL_FROM}'
  WEB_APP_URL: '${WEB_APP_URL}'
