apiVersion: apps/v1
kind: Deployment
metadata:
  name: 4frames-api
  namespace: default
  labels:
    app: 4frames-api
spec:
  progressDeadlineSeconds: 900
  replicas: 2
  selector:
    matchLabels:
      app: 4frames-api
  template:
    metadata:
      labels:
        app: 4frames-api
    spec:
      containers:
        - name: 4frames-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: 4frames-db-secret
            - secretRef:
                name: 4frames-aws-secret
            - configMapRef:
                name: 4frames-config
          readinessProbe:
            httpGet:
              path: /health-check
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health-check
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      terminationGracePeriodSeconds: 30
