apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: 4frames-api-hpa
  namespace: default
  labels:
    app: 4frames-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: 4frames-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
