apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: 4frames
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: 4frames
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/part-of: 4frames
    spec:
      containers:
        - name: notifier
          image: 4frames-notifier:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: 4frames-config
            - secretRef:
                name: 4frames-secret
          # Scaffold sem HTTP: a readiness prova só que o processo ficou de pé.
          readinessProbe:
            exec:
              command: ['node', '-e', 'process.exit(0)']
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['node', '-e', 'process.exit(0)']
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
