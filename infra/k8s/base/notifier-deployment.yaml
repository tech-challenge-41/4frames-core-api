apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: 4frames
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: 4frames
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/part-of: 4frames
    spec:
      containers:
        - name: notifier
          image: 4frames-notifier:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: 4frames-config
            - secretRef:
                name: 4frames-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: 4frames-notifier
            - name: DD_SERVICE
              value: 4frames-notifier
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # /healthz só abre depois da assinatura de jobs.events e responde 503 se a conexão com o
          # Redis terminar de vez: sem assinatura, o notifier não recebe evento nenhum.
          # A startupProbe dá até 150 s para a partida (assinatura incluída) antes de a liveness contar.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
