# Front (4frames-web-app): o build do Vite servido por nginx sem root na 8080, com a API em /api pelo Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: 4frames
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: 4frames
spec:
  # Arquivos estáticos: uma réplica basta. No rolling update, a nova fica pronta antes de a antiga sair.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: 4frames
    spec:
      containers:
        - name: web
          image: 4frames-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # A imagem nginx-unprivileged roda como o usuário nginx (uid 101).
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          # O nginx responde em milissegundos depois de subir: sem startupProbe, ao contrário dos apps Node.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
