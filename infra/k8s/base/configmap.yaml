apiVersion: v1
kind: ConfigMap
metadata:
  name: 4frames-config
  namespace: 4frames
data:
  NODE_ENV: production
  APP_ENV: production
  PORT: '3000'
  LOG_LEVEL: info
  CORS_ORIGIN: http://localhost:8080
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_DATABASE: 4frames_core
  DB_SCHEMA: public
  DB_SSLMODE: disable
  DB_USERNAME: admin
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
  S3_BUCKET_NAME: 4frames-videos
  UPLOAD_URL_TTL_SECONDS: '300'
  SQS_QUEUE_URL: http://localstack:4566/000000000000/4frames-video-uploads
  SQS_DLQ_URL: http://localstack:4566/000000000000/4frames-video-uploads-dlq
  VISIBILITY_TIMEOUT_SECONDS: '600'
  REDIS_URL: redis://redis:6379
  FRAME_FPS: '1'
  FRAME_FORMAT: png
  MAX_VIDEO_DURATION_SECONDS: '600'
  WORKER_TMP_DIR: /tmp/4frames
  WORKER_HEALTH_PORT: '9100'
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: '570'
  FFMPEG_TIMEOUT_SECONDS: '1800'
  JWT_EXPIRES_IN: '21600'
