# Só para o smoke do CD. O Kind efêmero não tem a infra do Compose, e o notifier só fica pronto com a
# assinatura de jobs.events ativa. API e worker sobem sem Postgres e LocalStack: a probe da API não
# consulta o banco, e o worker trata a falha do SQS com nova tentativa.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: 4frames
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: 4frames
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: 4frames
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: 4frames
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: 4frames
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
