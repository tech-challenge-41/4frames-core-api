apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - redis.yaml

patches:
  # O Kind efêmero do CD não tem Postgres: o Job de migrations ficaria falhando. O smoke não usa o banco.
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: migrate
        namespace: 4frames
  # A imagem 4frames-web é do 4frames-web-app e não é construída aqui: o pod ficaria em ErrImagePull. O Service
  # web fica sem endpoints e o Ingress sem controller, como o da API, e o smoke não passa por nenhum dos dois.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        namespace: 4frames
  # Sem Postgres, o GET /ready responde 503 e a API nunca ficaria pronta: o rollout do CD falharia. Aqui a
  # readiness volta a ser o /health-check, que só diz que o processo está de pé, como o smoke precisa.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /health-check

# O workflow de CD sobrescreve newName/newTag com `kustomize edit set image`
# para as imagens acabadas de construir (carregadas no Kind via kind load).
images:
  - name: 4frames-api
    newName: 4frames-api
    newTag: ci
  - name: 4frames-worker
    newName: 4frames-worker
    newTag: ci
  - name: 4frames-notifier
    newName: 4frames-notifier
    newTag: ci
